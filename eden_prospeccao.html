<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eden — Central de Prospecção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0E0C;
  --surface: #111510;
  --surface2: #161B14;
  --border: #1E2820;
  --border2: #253020;
  --green: #2EE87A;
  --green-dim: #1AB85F;
  --blue: #1AB8F5;
  --text: #E8EDE8;
  --muted: #7A8A7A;
  --muted2: #4A5A4A;
  --hot: #FF6B35;
  --warm: #F5C842;
  --cold: #4A8AFF;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* NAV */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,14,12,0.9);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
}
.nav-brand {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 16px;
  background: linear-gradient(90deg, var(--green), var(--blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 0.05em;
}
.nav-tag {
  font-size: 11px; letter-spacing: 0.15em;
  color: var(--muted); text-transform: uppercase;
}

/* LAYOUT */
.wrapper { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 56px); }

/* SIDEBAR */
aside {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-head {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-head h2 {
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border2);
  background: transparent; color: var(--muted); cursor: pointer;
  transition: all 0.15s;
}
.filter-btn.active { border-color: var(--green); color: var(--green); background: rgba(46,232,122,0.08); }
.filter-btn:hover:not(.active) { border-color: var(--border2); color: var(--text); }

.lead-list { overflow-y: auto; flex: 1; }
.lead-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}
.lead-item:hover { background: var(--surface2); }
.lead-item.active { background: rgba(46,232,122,0.06); border-left: 2px solid var(--green); padding-left: 18px; }

.lead-name {
  font-family: 'Syne', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--text); margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lead-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.tier-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.score-bar-wrap { height: 2px; background: var(--border); border-radius: 2px; margin-top: 8px; }
.score-bar { height: 2px; border-radius: 2px; transition: width 0.4s ease; }

.ai-badge {
  position: absolute; top: 10px; right: 12px;
  font-size: 9px; font-family: 'IBM Plex Mono', monospace;
  background: rgba(46,232,122,0.12); color: var(--green);
  padding: 2px 6px; border-radius: 3px;
  letter-spacing: 0.08em;
}
.urgencia-badge {
  position: absolute; top: 10px; right: 12px;
  font-size: 9px; font-family: 'IBM Plex Mono', monospace;
  background: rgba(255,107,53,0.15); color: var(--hot);
  padding: 2px 6px; border-radius: 3px;
  letter-spacing: 0.08em;
}

/* MAIN PANEL */
main {
  display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg);
}

/* API KEY BAR */
.api-bar {
  padding: 12px 32px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); flex-shrink: 0;
}
.api-label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.api-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border2);
  border-radius: 6px; padding: 7px 12px; color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  outline: none; transition: border-color 0.2s;
}
.api-input:focus { border-color: var(--green); }
.api-input::placeholder { color: var(--muted2); }
.api-status { font-size: 11px; color: var(--muted); white-space: nowrap; }
.api-status.ok { color: var(--green); }

/* EMPTY STATE */
.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  color: var(--muted);
}
.empty-icon { font-size: 40px; opacity: 0.3; }
.empty-state p { font-size: 13px; text-align: center; }
.empty-state code {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--surface2); padding: 2px 6px;
  border-radius: 4px; font-size: 12px;
}

/* LEAD DETAIL */
.lead-detail { flex: 1; overflow-y: auto; padding: 32px; display: none; }
.lead-detail.visible { display: block; }

.detail-header { margin-bottom: 28px; }
.detail-title {
  font-family: 'Syne', sans-serif;
  font-size: 22px; font-weight: 700; margin-bottom: 8px;
}
.detail-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border2); color: var(--muted);
}
.chip.green { border-color: rgba(46,232,122,0.3); color: var(--green); background: rgba(46,232,122,0.06); }
.chip.blue  { border-color: rgba(26,184,245,0.3); color: var(--blue);  background: rgba(26,184,245,0.06); }
.chip.hot   { border-color: rgba(255,107,53,0.3);  color: var(--hot);   background: rgba(255,107,53,0.06); }
.chip.warm  { border-color: rgba(245,200,66,0.3);  color: var(--warm);  background: rgba(245,200,66,0.06); }

/* SCORE BLOCK */
.score-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 20px;
}
.score-block-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.score-block-title {
  font-family: 'Syne', sans-serif; font-size: 12px;
  font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
}
.score-num {
  font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 700;
}
.criteria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.criterion {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px;
}
.criterion-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
.criterion-val { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 600; }
.criterion-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* CONTACTS */
.contacts-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.contact-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  min-width: 160px;
}
.contact-icon { font-size: 16px; }
.contact-val { font-size: 12px; color: var(--text); }
.contact-type { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

/* AI SECTION */
.ai-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 20px;
  overflow: hidden;
}
.ai-section-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.ai-section-title {
  font-family: 'Syne', sans-serif; font-size: 12px;
  font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--green); display: flex; align-items: center; gap: 8px;
}
.ai-section-body { padding: 20px; }

/* ABORDAGEM CARD (dados do backend) */
.abordagem-card {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 8px; padding: 14px 16px; margin-bottom: 16px;
}
.abordagem-card-label {
  font-size: 10px; font-family: 'IBM Plex Mono', monospace;
  color: var(--blue); letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 8px;
}
.abordagem-meta { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.abordagem-meta span {
  font-size: 11px; font-family: 'IBM Plex Mono', monospace;
  background: var(--surface); border: 1px solid var(--border2);
  color: var(--muted); padding: 2px 8px; border-radius: 4px;
}

/* BUTTONS */
.btn {
  font-family: 'Syne', sans-serif; font-size: 12px;
  font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 10px 20px; border-radius: 6px; border: none;
  cursor: pointer; transition: all 0.2s; display: inline-flex;
  align-items: center; gap: 8px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--green), #1de87a);
  color: #000;
}
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text);
}
.btn-secondary:hover { border-color: var(--green); color: var(--green); }
.btn-ghost {
  background: transparent; color: var(--muted);
  font-size: 11px; padding: 6px 12px;
}
.btn-ghost:hover { color: var(--green); }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* QUALIFICAÇÃO OUTPUT */
.qual-output {
  font-size: 13px; line-height: 1.8; color: var(--text);
}
.qual-section { margin-bottom: 16px; }
.qual-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--green); letter-spacing: 0.15em; text-transform: uppercase;
  margin-bottom: 6px;
}
.qual-text { color: var(--text); }

/* MENSAGEM OUTPUT */
.msg-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 18px;
  font-size: 13px; line-height: 1.85;
  color: var(--text); white-space: pre-wrap;
  position: relative;
}
.copy-btn {
  position: absolute; top: 10px; right: 10px;
  font-size: 10px; font-family: 'IBM Plex Mono', monospace;
  background: var(--border); color: var(--muted);
  border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer;
  transition: all 0.15s;
}
.copy-btn:hover { background: var(--green); color: #000; }

/* TABS */
.tabs { display: flex; gap: 2px; margin-bottom: 16px; }
.tab {
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 8px 16px; border-radius: 6px; border: none;
  background: transparent; color: var(--muted); cursor: pointer;
  transition: all 0.15s;
}
.tab.active { background: var(--surface2); color: var(--text); }
.tab:hover:not(.active) { color: var(--text); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* SPINNER */
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(46,232,122,0.2); border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* BULK BAR */
.bulk-bar {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.bulk-bar-inner { display: flex; gap: 8px; align-items: center; }
.bulk-progress { flex: 1; height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bulk-progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--blue)); transition: width 0.3s; border-radius: 3px; }

/* STATS BAR */
.stats-bar {
  display: flex; gap: 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.stat { text-align: center; }
.stat-n { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; }
.stat-l { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* TEXTAREA */
textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;
  line-height: 1.7; resize: vertical; outline: none;
  transition: border-color 0.2s; min-height: 80px;
}
textarea:focus { border-color: var(--green-dim); }
textarea::placeholder { color: var(--muted2); }

.divider { height: 1px; background: var(--border); margin: 20px 0; }

/* WA LINK */
.wa-link {
  display: inline-flex; align-items: center; gap: 6px;
  background: #25D366; color: #000; font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-decoration: none; padding: 8px 16px; border-radius: 6px;
  transition: opacity 0.2s;
}
.wa-link:hover { opacity: 0.88; }

.note { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* LOADING */
.loading-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  color: var(--muted);
}
</style>
</head>
<body>

<nav>
  <span class="nav-brand">EDEN</span>
  <span class="nav-tag">Central de Prospecção</span>
  <span class="nav-tag" id="nav-count">Carregando...</span>
</nav>

<div class="wrapper">

  <!-- SIDEBAR -->
  <aside>
    <div class="sidebar-head">
      <h2>Leads</h2>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('TODOS',this)">Todos</button>
        <button class="filter-btn" onclick="setFilter('QUENTE',this)">🔥 Quente</button>
        <button class="filter-btn" onclick="setFilter('MORNO',this)">Morno</button>
        <button class="filter-btn" onclick="setFilter('FRIO',this)">Frio</button>
        <button class="filter-btn" onclick="setFilter('QUALIFICADO',this)">IA ✓</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-n" id="s-total">–</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--hot)" id="s-quente">–</div><div class="stat-l">Quente</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--warm)" id="s-morno">–</div><div class="stat-l">Morno</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--green)" id="s-qual">–</div><div class="stat-l">IA pronto</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--blue)" id="s-tel">–</div><div class="stat-l">Tel</div></div>
    </div>
    <div class="lead-list" id="lead-list"></div>
    <div class="bulk-bar">
      <div class="bulk-bar-inner">
        <button class="btn btn-secondary" style="font-size:11px;padding:8px 14px" onclick="qualificarTodos()" id="btn-bulk">
          ✦ Qualificar pendentes (IA)
        </button>
        <div class="bulk-progress" id="bulk-prog" style="display:none">
          <div class="bulk-progress-fill" id="bulk-fill" style="width:0%"></div>
        </div>
        <span id="bulk-status" style="font-size:11px;color:var(--muted)"></span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <!-- API KEY -->
    <div class="api-bar">
      <span class="api-label">Anthropic API Key</span>
      <input class="api-input" type="password" id="api-key" placeholder="sk-ant-..." oninput="updateApiStatus()">
      <span class="api-status" id="api-status">Sem chave — modo offline</span>
    </div>

    <!-- EMPTY / LOADING -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">⏳</div>
      <p>Carregando leads do banco de dados...</p>
    </div>

    <!-- DETAIL -->
    <div class="lead-detail" id="lead-detail"></div>
  </main>
</div>

<script>
// ── Estado ──────────────────────────────────────────────────────────────────
const state = { leads: [], filtro: 'TODOS', selectedId: null };

// ── INIT (busca da API) ──────────────────────────────────────────────────────
async function init() {
  try {
    const resp = await fetch('/api/leads');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    state.leads = await resp.json();
  } catch (e) {
    console.error('Erro ao carregar leads:', e);
    document.getElementById('empty-state').innerHTML = `
      <div class="empty-icon" style="opacity:0.5">⚠️</div>
      <p>Não foi possível carregar os leads.</p>
      <p style="font-size:12px;margin-top:4px">Certifique-se de que o servidor está rodando:</p>
      <p><code>python serve_prospeccao.py</code></p>
    `;
    state.leads = [];
  }
  renderList();
  updateStats();
  document.getElementById('nav-count').textContent = `${state.leads.length} leads`;

  if (state.leads.length > 0) {
    document.getElementById('empty-state').innerHTML = `
      <div class="empty-icon">◎</div>
      <p>Selecione um lead para ver detalhes e gerar abordagem</p>
    `;
  }
}

// ── UTILS ────────────────────────────────────────────────────────────────────
function getApiKey() { return document.getElementById('api-key').value.trim(); }
function updateApiStatus() {
  const k = getApiKey();
  const el = document.getElementById('api-status');
  if (k.startsWith('sk-ant-')) { el.textContent = '✓ Claude ativo'; el.className = 'api-status ok'; }
  else { el.textContent = 'Sem chave — modo offline'; el.className = 'api-status'; }
}

function tierColor(tier) {
  if (tier === 'QUENTE') return 'var(--hot)';
  if (tier === 'MORNO')  return 'var(--warm)';
  return 'var(--cold)';
}
function tierClass(tier) {
  if (tier === 'QUENTE') return 'hot';
  if (tier === 'MORNO')  return 'warm';
  return '';
}
function scoreColor(s) {
  if (s >= 70) return 'var(--hot)';
  if (s >= 40) return 'var(--warm)';
  return 'var(--cold)';
}

function telLimpo(t) { return (t || '').replace(/\D/g,''); }
function waLink(tel, msg) {
  const t = telLimpo(tel);
  const num = t.startsWith('55') ? t : '55' + t;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg||'')}`;
}

function copy(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copiado!';
    btn.style.background = 'var(--green)';
    btn.style.color = '#000';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.color = ''; }, 1800);
  });
}

// ── LISTA ────────────────────────────────────────────────────────────────────
function setFilter(f, btn) {
  state.filtro = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderList();
}

function filteredLeads() {
  if (state.filtro === 'TODOS')       return state.leads;
  if (state.filtro === 'QUALIFICADO') return state.leads.filter(l => l._aiData);
  return state.leads.filter(l => l.tier === state.filtro);
}

function renderList() {
  const list  = document.getElementById('lead-list');
  const leads = filteredLeads();
  if (!leads.length) {
    list.innerHTML = `<div style="padding:24px 20px;text-align:center;color:var(--muted);font-size:12px">Nenhum lead neste filtro</div>`;
    return;
  }
  list.innerHTML = leads.map(l => {
    const score  = l._aiScore ?? l.score_final;
    const tier   = l._aiData?.tier ?? l.tier;
    const tierC  = tierColor(tier);
    const hasAI  = !!l._aiData;
    const imdt   = l.urgencia === 'IMEDIATO';
    const badge  = imdt
      ? `<span class="urgencia-badge">⚡ IMEDIATO</span>`
      : hasAI ? `<span class="ai-badge">IA ✓</span>` : '';
    return `
    <div class="lead-item${state.selectedId === l.id ? ' active' : ''}"
         onclick="selectLead(${l.id})">
      ${badge}
      <div class="lead-name">${l.nome}</div>
      <div class="lead-meta">
        <span class="tier-dot" style="background:${tierC}"></span>
        <span>${tier}</span>
        <span>·</span>
        <span style="color:${scoreColor(score)}">${score}/100</span>
        ${l.instagram ? `<span>· 📱</span>` : ''}
        ${l.telefone  ? `<span>· 📞</span>` : ''}
      </div>
      <div class="score-bar-wrap">

function copyMsg(elId, btn) {
  const el = document.getElementById(elId);
  if (!el) return;
  // Pega o texto sem o botão de copiar
  const clone = el.cloneNode(true);
  clone.querySelectorAll('.copy-btn').forEach(b => b.remove());
  copy(clone.innerText.trim(), btn);
}

function switchTab(btn, panelId) {
  const section = btn.closest('.ai-section-body');
  section.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  section.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(panelId).classList.add('active');
}

// ── SCORE LOCAL ───────────────────────────────────────────────────────────────
function calcularCriterios(lead) {
  const nichos_eden = ['clinica','clínica','odonto','médic','medic','escola','curso','academia','salao','salão','barbearia','estetica','estética','restaurante','loja','oficina','contabil','pet','farmacia'];
  const nichoOk = nichos_eden.some(n => (lead.nicho||'').toLowerCase().includes(n));
  const segPts  = nichoOk ? 25 : 15;

  let revPts, revObs;
  if (lead.num_reviews >= 100)     { revPts = 20; revObs = `${lead.num_reviews} reviews`; }
  else if (lead.num_reviews >= 20) { revPts = 14; revObs = `${lead.num_reviews} reviews`; }
  else if (lead.num_reviews >= 5)  { revPts = 8;  revObs = `${lead.num_reviews} reviews`; }
  else                              { revPts = 4;  revObs = `${lead.num_reviews||0} reviews`; }

  const temSite  = !!(lead.site && !lead.site.includes('instagram.com') && !lead.site.includes('maapp'));
  const temInsta = !!lead.instagram;
  let digPts, digObs;
  if (temInsta && !temSite)       { digPts = 20; digObs = 'Instagram ativo, sem site'; }
  else if (!temInsta && !temSite) { digPts = 14; digObs = 'Sem presença digital'; }
  else if (temSite && temInsta)   { digPts = 8;  digObs = 'Tem site + Instagram'; }
  else                            { digPts = 12; digObs = 'Presença parcial'; }

  const contPts = lead.telefone ? 15 : 0;
  const contObs = lead.telefone ? 'WhatsApp disponível' : 'Sem contato direto';

  const portePts = lead.porte === 'ME' || lead.porte === 'EPP' ? 15 :
                   lead.porte === 'MEI' ? 8 : 5;
  const porteObs = lead.porte || 'Não informado';

  const total = segPts + revPts + digPts + contPts + portePts;

  return [
    { label: 'Segmento',        pts: segPts,  max: 25, obs: lead.nicho || '–' },
    { label: 'Movimento',       pts: revPts,  max: 20, obs: revObs },
    { label: 'Presença digital',pts: digPts,  max: 20, obs: digObs },
    { label: 'Contato direto',  pts: contPts, max: 15, obs: contObs },
    { label: 'Porte',           pts: portePts,max: 15, obs: porteObs },
    { label: 'Score calculado', pts: total,   max: 95, obs: total >= 60 ? 'Alta prioridade' : total >= 40 ? 'Boa oportunidade' : 'Nutrir' },
  ];
}

// ── CLAUDE API ────────────────────────────────────────────────────────────────
async function chamarClaude(prompt, sistemaMsg) {
  const key = getApiKey();
  if (!key) throw new Error('Sem chave API');

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1200,
      system: sistemaMsg,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  return data.content?.[0]?.text || '';
}

const SYSTEM_QUAL = `Você é o agente de qualificação comercial da Eden Technology, empresa de software, automação e dashboards para PMEs brasileiras (salões, clínicas, pousadas, restaurantes, academias, comércio local).

Eden Technology oferece:
- Sistema de gestão (agendamentos, clientes, financeiro)
- Site profissional com SEO
- Tráfego pago (Google Ads + Meta Ads)
- Automação de WhatsApp (chatbot 24h, confirmações, follow-up)
- Dashboards de dados e relatórios

Retorne APENAS JSON válido, sem markdown:
{
  "tier": "MORNO" | "QUENTE" | "FRIO",
  "score": number (0-100),
  "diagnostico": "2-3 frases sobre o potencial e situação do lead",
  "dores": ["dor 1", "dor 2", "dor 3"],
  "oportunidade": "principal oportunidade de venda Eden",
  "solucoes": ["Solução Eden 1", "Solução Eden 2"],
  "mensagem_wa1": "mensagem de primeiro contato WhatsApp — máx 5 linhas, pessoal, sem ser robótico, cite o nome do estabelecimento, NÃO use 'prezado' nem linguagem formal",
  "mensagem_wa2": "follow-up para 3 dias depois se não responder — curta e direta, 2-3 linhas",
  "mensagem_dm": "DM do Instagram — casual, 3 linhas max"
}`;

async function qualificarLead(id) {
  const lead = state.leads.find(l => l.id === id);
  if (!lead) return;

  const btn = document.getElementById(`btn-qual-${id}`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Analisando...'; }

  const prompt = `Analise este lead para prospecção da Eden Technology:

Nome: ${lead.nome}
Nicho: ${lead.nicho}
Cidade: ${lead.cidade}${lead.estado ? ', ' + lead.estado : ''}
Telefone: ${lead.telefone || 'não informado'}
Instagram: ${lead.instagram || 'não encontrado'}
Site: ${lead.site || 'não tem'}
CNPJ: ${lead.cnpj || 'não encontrado'}
Porte: ${lead.porte || 'não informado'}
Google Maps: ${lead.nota_maps} estrelas, ${lead.num_reviews} avaliações
Score atual: ${lead.score_final}/100 (${lead.tier})
Urgência: ${lead.urgencia || 'não classificado'}
${lead.urgencia === 'IMEDIATO' ? '⚡ LEAD IMEDIATO — prioridade máxima!' : ''}

Contexto:
${lead.site && lead.site.includes('maapp') ? 'Usa MaApp (agendamento básico).' : ''}
${!lead.site && !lead.instagram ? 'Sem presença digital identificada.' : ''}
${lead.instagram && !lead.site ? 'Tem Instagram mas sem site próprio — oportunidade clara.' : ''}`;

  try {
    const raw   = await chamarClaude(prompt, SYSTEM_QUAL);
    const clean = raw.replace(/```json\n?|\n?```/g, '').trim();
    const data  = JSON.parse(clean);

    lead._aiData  = data;
    lead._aiScore = data.score;

    updateStats();
    renderList();
    if (state.selectedId === id) renderDetail(lead);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.innerHTML = '✦ Qualificar com IA'; }
    alert('Erro: ' + e.message + '\n\nVerifique a chave API e tente novamente.');
  }
}

async function requalificar(id) { await qualificarLead(id); }

async function gerarMensagens(id) {
  const lead = state.leads.find(l => l.id === id);
  if (!lead) return;
  if (!lead._aiData) { await qualificarLead(id); return; }

  const btn = document.getElementById(`btn-gen-${id}`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Gerando...'; }

  const prompt = `Gere as 3 mensagens de abordagem para este lead qualificado:

Nome: ${lead.nome}
Nicho: ${lead.nicho}
Instagram: ${lead.instagram || 'não tem'}
Diagnóstico: ${lead._aiData.diagnostico}
Oportunidade: ${lead._aiData.oportunidade}
Soluções: ${(lead._aiData.solucoes||[]).join(', ')}

Retorne APENAS JSON:
{
  "mensagem_wa1": "primeiro contato WhatsApp — pessoal, até 5 linhas",
  "mensagem_wa2": "follow-up 3 dias depois — curto, direto, 2-3 linhas",
  "mensagem_dm": "DM Instagram — casual, 2-3 linhas"
}`;

  try {
    const raw  = await chamarClaude(prompt, 'Você é copywriter da Eden Technology. Escreva mensagens de prospecção pessoais, diretas e sem cara de robô. Nunca use "prezado" ou linguagem formal. Retorne apenas JSON.');
    const clean = raw.replace(/```json\n?|\n?```/g, '').trim();
    const msgs  = JSON.parse(clean);
    lead._aiData.mensagem_wa1 = msgs.mensagem_wa1 || lead._aiData.mensagem_wa1;
    lead._aiData.mensagem_wa2 = msgs.mensagem_wa2 || '';
    lead._aiData.mensagem_dm  = msgs.mensagem_dm  || '';
    if (state.selectedId === id) renderDetail(lead);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.innerHTML = '✦ Gerar WhatsApp + DM'; }
    alert('Erro: ' + e.message);
  }
}

async function regenerarMsg(id, tipo) {
  const lead = state.leads.find(l => l.id === id);
  if (!lead || !lead._aiData) return;

  const el = document.getElementById(`msg-${tipo}-${id}`);
  if (!el) return;
  el.innerHTML = '<span class="spinner"></span> Gerando...';

  const tipLabel = tipo === 'wa1' ? 'primeiro contato WhatsApp' : tipo === 'wa2' ? 'follow-up WhatsApp (3 dias depois)' : 'DM Instagram';
  const prompt = `Gere UMA mensagem de ${tipLabel} para este lead:
Nome: ${lead.nome} | Nicho: ${lead.nicho} | Instagram: ${lead.instagram || 'não tem'}
Diagnóstico: ${lead._aiData.diagnostico}
Oportunidade: ${lead._aiData.oportunidade}

Retorne APENAS o texto da mensagem, sem JSON, sem aspas.`;

  try {
    const text = await chamarClaude(prompt, 'Você é copywriter da Eden Technology. Mensagens pessoais, diretas, sem robôs. Nunca use "prezado".');
    const field = tipo === 'wa1' ? 'mensagem_wa1' : tipo === 'wa2' ? 'mensagem_wa2' : 'mensagem_dm';
    lead._aiData[field] = text;
    renderDetail(lead);
    setTimeout(() => {
      const tabMap = { wa1: 0, wa2: 1, dm: 2 };
      const tabs = document.querySelectorAll(`#lead-detail .tab`);
      if (tabs[tabMap[tipo]]) tabs[tabMap[tipo]].click();
    }, 100);
  } catch (e) {
    el.textContent = 'Erro ao regenerar. Tente novamente.';
  }
}

// ── QUALIFICAR TODOS ──────────────────────────────────────────────────────────
async function qualificarTodos() {
  const key = getApiKey();
  if (!key) { alert('Informe a chave API Anthropic acima antes de continuar.'); return; }

  const pendentes = state.leads.filter(l => !l._aiData && l.tier !== 'FRIO');
  if (!pendentes.length) { alert('Todos os leads MORNO e QUENTE já foram qualificados!'); return; }

  const btn = document.getElementById('btn-bulk');
  btn.disabled = true;
  document.getElementById('bulk-prog').style.display = 'flex';

  let done = 0;
  for (const lead of pendentes) {
    document.getElementById('bulk-status').textContent = `${done+1}/${pendentes.length} — ${lead.nome.slice(0,22)}...`;

    const prompt = `Analise este lead para a Eden Technology:
Nome: ${lead.nome} | Nicho: ${lead.nicho} | Cidade: ${lead.cidade}
Tel: ${lead.telefone||'não inf.'} | Instagram: ${lead.instagram||'não'} | Site: ${lead.site||'não'}
Score: ${lead.score_final}/100 (${lead.tier}) | Urgência: ${lead.urgencia||'-'}
${!lead.site && !lead.instagram ? 'Sem presença digital.' : lead.instagram && !lead.site ? 'Tem Instagram, sem site.' : ''}`;

    try {
      const raw  = await chamarClaude(prompt, SYSTEM_QUAL);
      const data = JSON.parse(raw.replace(/```json\n?|\n?```/g,'').trim());
      lead._aiData  = data;
      lead._aiScore = data.score;
    } catch (_) { /* continua */ }

    done++;
    document.getElementById('bulk-fill').style.width = `${(done/pendentes.length)*100}%`;
    updateStats();
    renderList();
    await new Promise(r => setTimeout(r, 350));
  }

  btn.disabled = false;
  document.getElementById('bulk-status').textContent = `✓ ${done} qualificados!`;
  document.getElementById('bulk-prog').style.display = 'none';
  updateStats();
  if (state.selectedId) {
    const lead = state.leads.find(l => l.id === state.selectedId);
    if (lead?._aiData) renderDetail(lead);
  }
}
